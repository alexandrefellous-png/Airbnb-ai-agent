services:
  - type: web
    name: airbnb-ai-agent-v2
    runtime: python
    rootDir: maison-v2
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.lock.txt
    preDeployCommand: python -m scripts.prepare_render
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: TEST_MODE
        value: "true"
      - key: ALLOW_LIVE_SENDS
        value: "false"
      - key: WORKER_ENABLED
        value: "true"
      - key: MEDIA_STORAGE
        value: database
      - key: OBSERVATION_INTERVAL_SECONDS
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: airbnb-agent-db
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
databases:
  - name: airbnb-agent-db
    databaseName: agent
    user: agent
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: "18"
    ipAllowList: []
