<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer mon compte · Maison</title><link rel="stylesheet" href="/static/manager.css"></head><body class="login-body"><main class="login-card"><div class="brand-mark">m.</div><p class="eyebrow">VOTRE CONCIERGERIE, BIEN ACCOMPAGNÉE</p><h1>Votre espace commence ici.</h1><p class="muted">Choisissez vos accès. Connectez Guesty. Ajoutez vos logements.</p><form id="register-form"><label>Nom de votre conciergerie<input name="workspace_name" required minlength="2" maxlength="160" autocomplete="organization" placeholder="Ex. Maison Paris"></label><label>Votre email<input name="email" type="email" required maxlength="250" autocomplete="username" placeholder="vous@conciergerie.fr"></label><label>Choisissez votre mot de passe<input name="password" type="password" required minlength="12" maxlength="500" autocomplete="new-password"><small>12 caractères minimum.</small></label><label>Confirmez le mot de passe<input name="confirm_password" type="password" required minlength="12" autocomplete="new-password"></label><p id="register-error" role="alert"></p><button class="primary" type="submit">Créer mon compte →</button></form><p class="fine">Votre espace démarre en mode test : l’agent propose ses réponses avant tout envoi réel.</p><p class="auth-switch">Déjà un compte ? <a href="/admin/login">Se connecter</a></p></main><script src="/static/register.js" defer></script></body></html>
